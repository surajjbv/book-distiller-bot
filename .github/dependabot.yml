# Dependency update pull requests, once a month, grouped; versions must be 2+ weeks old (cooldown).
# Packages get minor and patch updates only: a major version is a deliberate upgrade, done by hand.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
    cooldown: { default-days: 14 }
    groups: { actions: { patterns: ["*"] } }
  - package-ecosystem: pip
    directory: /
    schedule: { interval: monthly }
    cooldown: { default-days: 14 }
    groups: { dependencies: { patterns: ["*"] } }
    ignore: [{ dependency-name: "*", update-types: ["version-update:semver-major"] }]
