[project]
name = "book-distiller-bot"
version = "1.0.0"
description = "Drop a book in a folder; get a faithful, readable summary (HTML + EPUB) back, with every quote checked."
readme = "README.md"
license = "MIT"
requires-python = ">=3.14"
# Dependencies: requirements.in (ranges) is compiled to requirements.txt (exact pins, run.sh installs them).

[tool.ruff]
line-length = 120
target-version = "py314"

[tool.ruff.lint]
select = ["F", "E9", "B"]  # real bugs only: pyflakes, syntax errors, bugbear

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B017"]  # tests may expect any exception on purpose
