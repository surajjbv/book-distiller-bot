# Book Distiller configuration. Paths are relative to this folder unless absolute.

endpoint: http://localhost:1234/v1   # LM Studio OpenAI-compatible server
lms_path: null                       # LM Studio CLI; null = ~/.lmstudio/bin/lms or $PATH

# The one model used for everything (text, JSON extraction and figure captions). No fallbacks.
model: qwen3.8-27b-mlx

context_length: 16384    # passed to `lms load --context-length`; every prompt is budgeted to fit
parallel: 2              # requests run at once (2 = ~1.2x faster on a 32 GB Mac; 4 is faster but swaps)
takeover_idle_minutes: 5 # another app's model idle this long counts as abandoned and is unloaded; busy ones are waited for
max_minutes: 120        # longest summary the planner may choose (split into 30-minute parts, so at most 4)
chunk_tokens: 8000       # max tokens per chapter chunk (bigger chapters split at paragraph breaks)
min_chunk_tokens: 700    # smaller chunks are merged with a neighbour
temperature: 0.3
max_output_tokens: 3500  # per call
request_timeout: 1800    # seconds per call

image_cap: 15            # figures kept in the summary
image_candidates: 30     # most figures sent to the model for screening (largest first)
min_image_px: 160

quote_match_threshold: 90   # quotes must fuzzy-match the book at this score (0-100) or they are dropped

drive_folder: null          # null = auto-detect ~/Library/CloudStorage/GoogleDrive-*/My Drive
drive_subfolder: Book Summaries

watch_interval: 30          # seconds between checks in watch mode
notify: true                # macOS notification when a book finishes
